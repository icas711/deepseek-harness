# Оверлей удалённого доступа для `dsh web` (запуск в контейнере на сервере).
# Биндит веб-сервер на все интерфейсы контейнера.
# Патч заменяет config строки `webserver` целиком, поэтому переписывает
# и host, и port; флаг `--port` при этом по-прежнему работает (ctx.webStartup).
#
# Вход по логину и паролю включает строка `web-auth` из патча бандла web-app:
# она читает DSH_WEB_USERS / DSH_WEB_ADMINS из окружения (compose подставляет
# их из deploy/.env и отказывается стартовать без DSH_WEB_USERS), хранит
# серверные сессии в $DSH_HOME/web-sessions.json и создаёт персональные
# каталоги-кабинеты в /workspace/<логин>.
#
# Наружу торчит только опубликованный порт контейнера: compose публикует его
# на 127.0.0.1 хоста, а наружу отдаёт Caddy (HTTPS) или SSH-туннель.
- id: webserver
  config:
    host: '0.0.0.0'
    port: !!js ctx.webStartup.port ?? 3080

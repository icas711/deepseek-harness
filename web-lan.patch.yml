# Локальный LAN-оверлей для `dsh web`: биндит веб-сервер на все интерфейсы,
# чтобы GUI открывался с других устройств сети. Патч заменяет config строки
# `webserver` целиком, поэтому переписывает и host, и port. Раннтайм web-app
# при таком бинде сам сэмплирует LAN IPv4 адреса машины и передаёт их
# browser-trust fence (строки `web-runtime` и `connection` bundle-патча).
#
# Применение:
#   pnpm dsh web --patch web-lan.patch.yml --token <секрет>
# или задайте секрет через окружение (флаг приоритетнее):
#   $env:DSH_WEB_TOKEN = '<секрет>'; pnpm dsh web --patch web-lan.patch.yml
#
# ВНИМАНИЕ: GUI управляет агентом, который исполняет команды на этой машине;
# бинд на все интерфейсы открывает его всей локальной сети. Без токена
# единственной защитой остаётся Host-fence (анти-DNS-rebinding), а не
# аутентификация — задавайте токен.
- id: webserver
  config:
    host: '0.0.0.0'
    # 3080 занят GUI работающей сессии, 3081 занят сторонним процессом.
    port: 3082
    token: !!js ctx.webStartup.token ?? (process.env.DSH_WEB_TOKEN || undefined)
